<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling</title>
    <style>
         .class{
            position: relative;
        }
        hr{
            position: absolute;
            top : 30px;
            left: 0px;
            width: 80px;
            height: 3px;
            border-radius: 10px;
            background-color: yellow;
            border: none;
        }

        .div{
            width: 250px;
            background-color: aqua;
            text-align: center;
            border-radius: 30px;
            padding-top: 10px;
        }
        .container{
            display: flex;
            gap: 30px;
            padding: 30px 30px 30px 130px;
            border: 2px solid gray;
        }
        
    </style>

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">     

</head>
<body>
    <div class="class">
        <h1>Our Services
        </h1>
        <hr>
    </div>
    <div class="row">
        <div class="col-12  col-sm-6 col-md-3 bg-danger">item1</div>
        <div class="col-12  col-sm-6  col-md-3 bg-primary">item2</div>
        <div class="col-12  col-sm-6 col-md-3 bg-success">item3</div>
        <div class="col-12  col-sm-6 col-md-3 bg-secondary">item3</div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
