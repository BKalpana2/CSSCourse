
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Card</title>
    <link rel="stylesheet" href="Profilecard.css">
</head>
<body>

    <div class="profile-card">

        <img src="https://via.placeholder.com/150"
             alt="Profile Picture"
             class="profile-img">

        <h1>Kalpana Bathula</h1>

        <h3>Aspiring Software Developer</h3>

        <p>
            Hello! I am a passionate software developer.
            I enjoy learning new technologies and building
            creative projects.
        </p>

        <div class="skills">
            <span>Java</span>
            <span>HTML</span>
            <span>CSS</span>
        </div>

        <div class="buttons">
            <button>Contact Me</button>
            <button>View Profile</button>
        </div>

    </div>

</body>
</html>
